[[rules]]
id = "l3.test_infrastructure"
level = "L3"
description = "Shared test infrastructure that can weaken every test"
patterns = [
  "backend/tests/conftest.py",
  "backend/tests/**/conftest.py",
  "backend/tests/**/helpers.py",
  "backend/tests/unit/finance/reference.py",
  "frontend/tests/**",
  "frontend/e2e/global-setup.ts",
  "frontend/e2e/helpers.ts",
  "frontend/e2e/start-backend.sh",
]

# ------------------------------------------------------------------ L2 rules

[[rules]]
id = "l2.backend_app"
level = "L2"
description = "Backend application code outside L3 areas"
patterns = [
  "backend/app/__init__.py",
  "backend/app/main.py",
  "backend/app/core/__init__.py",
  "backend/app/api/**",
  "backend/app/schemas/**",
  "backend/app/services/**",
  "backend/app/tasks/**",
  "backend/app/utils/**",
]

[[rules]]
id = "l2.backend_tests"
level = "L2"
description = "Other backend tests"
patterns = [
  "backend/tests/**",
]

[[rules]]
id = "l2.frontend_app"
level = "L2"
description = "Frontend application code, styles and assets outside L3 areas"
patterns = [
  "frontend/app/**",
  "frontend/components/**",
  "frontend/lib/**",
  "frontend/public/**",
  "frontend/next-env.d.ts",
]

[[rules]]
id = "l2.frontend_tests"
level = "L2"
description = "Other frontend end-to-end tests"
patterns = [
  "frontend/e2e/**",
]

[[rules]]
id = "l2.tool_config"
level = "L2"
description = "Frontend tool configuration"
patterns = [
  "frontend/eslint.config.mjs",
  "frontend/postcss.config.mjs",
  "frontend/playwright.config.ts",
  "frontend/vitest.config.mts",
  "frontend/.prettierrc",
  "frontend/.prettierignore",
  "frontend/tsconfig.json",
]

[[rules]]
id = "l2.docs"
level = "L2"
description = "Root documents, operational docs and external AI tool context"
patterns = [
  "README.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "docs/DEPLOYMENT.md",
  "docs/DOCKER_COMPOSE.md",
  "docs/design/v0/**",
]

# ------------------------------------------------------------------ L1 rules
# Copy-only files are registered here as additional L1 rules with an id
# starting with "l1.copy_only." (a policy change, POLICY.md section 12).
# None are registered today.

[[rules]]
id = "l1.docs"
level = "L1"
description = "Documentation outside legal and the docs listed above"
patterns = [
  "docs/**",
]
