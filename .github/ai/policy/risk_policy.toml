  "backend/tests/integration/test_tenant_isolation.py",
  "backend/tests/integration/test_hardening.py",
  "backend/tests/integration/test_upload_api.py",
  "backend/tests/integration/test_imports_api.py",
  "backend/tests/integration/test_database.py",
  "backend/tests/integration/test_repositories.py",
  "backend/tests/integration/test_financial_summary.py",
