# Continuous integration for the backend and the frontend. No deployment happens here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (hash-checked lock)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff lint (app, tests, hand-written migrations)
        run: ruff check . alembic/versions/2026_11_18_1100-5d2fb0f83b83_core_financial_domain.py alembic/versions/2026_11_18_1121-bb94536e2d20_auth_tokens_balances_default_categories.py
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Mypy
        run: mypy

  test:
    name: Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: budget_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-only-password
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@localhost:5432/budget_test
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@localhost:5432/budget_migrations
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (hash-checked lock)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Create extra databases
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE budget_migrations"
          psql -h localhost -U postgres -c "CREATE DATABASE budget_alembic"
      - name: Migrations round trip (upgrade, drift check, downgrade, upgrade)
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-secret-key-0123456789abcdef
          DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@localhost:5432/budget_alembic
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest -q -p no:cacheprovider

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit (hash-checked)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Audit runtime lock
        run: pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
      - name: Audit dev lock
        run: pip-audit -r requirements-dev.txt --require-hashes --disable-pip --progress-spinner off

  frontend:
    name: Frontend (format, types, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false
      # pnpm comes from Corepack, pinned to frontend/package.json "packageManager".
      - name: Enable pnpm 12.21.0 (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate
          test "$(pnpm --version)" = "12.21.0"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t budgetanalytics-api:ci .
      - name: Smoke (imports, non-root user)
        run: |
          docker run --rm \
            -e ENVIRONMENT=test \
            -e DATABASE_URL=postgresql+asyncpg://u:p@localhost/db \
            -e SECRET_KEY=ci-only-secret-key-0123456789abcdef \
            budgetanalytics-api:ci \
            python -c "import os, app.main; assert os.getuid() != 0; print('ok')"
      - name: Production settings refuse an unsafe configuration
        run: |
          if docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://u:p@localhost/db \
            -e SECRET_KEY=short \
            budgetanalytics-api:ci python -c "import app.main"; then
            echo "expected the production image to refuse weak settings" && exit 1
          fi
