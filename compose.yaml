# Full local stack: Next.js frontend (BFF) → FastAPI → PostgreSQL + Redis.
#
#   cp .env.example .env      # set POSTGRES_PASSWORD, SECRET_KEY, REDIS_PASSWORD
#   docker compose up -d --build
#   open http://localhost:3000
#
# Reuses backend/Dockerfile and frontend/Dockerfile. Details, logs, migrations and
# troubleshooting: docs/DOCKER_COMPOSE.md.
#
# * The browser only talks to the frontend. Next.js keeps tokens in httpOnly
#   cookies and proxies /api/v1/* to the API at http://api:8000 (internal network).
# * PostgreSQL and Redis are NOT published on the host. To reach them from host
#   tools or pytest, add compose.dev-ports.yaml (127.0.0.1 only).
# * Same project name and volume key as backend/docker-compose.yml, so an existing
#   `budgetanalytics_pgdata` volume is reused, not replaced. Run one stack or the
#   other, not both at once.
# * Local/development use. Production: backend/docker-compose.prod.yml + docs/DEPLOYMENT.md.

name: budgetanalytics

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  # Passwords are embedded in URLs: use URL-safe values (letters, digits, - and _).
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-budget}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-budget}
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_BACKEND: redis
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  # The browser never calls the API directly (same-origin BFF), so no CORS origins.
  CORS_ORIGINS: ${CORS_ORIGINS:-[]}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  AI_PROVIDER: ${AI_PROVIDER:-none}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-budget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-budget}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Rate-limit counters only: no persistence needed.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    image: budgetanalytics-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    networks: [app]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: budgetanalytics-api:local
    environment:
      <<: *backend-env
      # Trust X-Forwarded-For only from the frontend container, so per-IP rate
      # limits see the real browser IP and nobody else can spoof it.
      FORWARDED_ALLOW_IPS: ${FRONTEND_IPV4:-172.31.250.10}
    ports:
      # Swagger UI (/docs) and direct API access for development; host-only.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    networks: [app]
    healthcheck:
      # Readiness: database answers and Redis (rate limiter) answers PING.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: budgetanalytics-frontend:local
    environment:
      BACKEND_URL: http://api:8000
    ports:
      # Session cookies are Secure: browsers accept them on http://localhost only.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    networks:
      app:
        ipv4_address: ${FRONTEND_IPV4:-172.31.250.10}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  app:
    ipam:
      config:
        # Fixed subnet so the frontend has a known address (see FORWARDED_ALLOW_IPS).
        # Change COMPOSE_SUBNET and FRONTEND_IPV4 together if it overlaps a local network.
        - subnet: ${COMPOSE_SUBNET:-172.31.250.0/24}

volumes:
  pgdata:
