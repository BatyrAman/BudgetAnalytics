# Локальная инфраструктура для разработки: PostgreSQL (+ Redis для ARQ worker).
#   docker compose up -d db
#   cd backend && alembic upgrade head && uvicorn app.main:app --reload
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    profiles: ["worker"]

volumes:
  pgdata:
